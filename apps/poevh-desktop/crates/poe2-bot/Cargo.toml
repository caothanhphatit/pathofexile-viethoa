[package]
name    = "poe2-bot"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "POEVH"
path = "src/main.rs"

[dependencies]
poe2-world = { path = "../poe2-world" }
poe2-engine  = { path = "../poe2-engine" }
poe2-overlay = { path = "../poe2-overlay" }
poe2-memory  = { path = "../poe2-memory" }
poe2-input   = { path = "../poe2-input" }
poe2-types   = { path = "../poe2-types" }
vigem-client = "0.1.4"
tokio        = { workspace = true }
tracing      = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow       = { workspace = true }
parking_lot  = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
embed-manifest = "1.5.0"

[workspace]
resolver = "2"
members = [
    "crates/poe2-types",
    "crates/poe2-world",
    "crates/poe2-engine",
    "crates/poe2-overlay",
    "crates/poe2-memory",
    "crates/poe2-input",
    "crates/poe2-bot",
]

[workspace.dependencies]
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
tokio       = { version = "1", features = ["full"] }
axum        = "0.7"
tower-http  = { version = "0.5", features = ["cors", "fs"] }
tracing     = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow      = "1"
parking_lot = "0.12"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

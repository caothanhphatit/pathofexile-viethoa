<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>POE2 Overlay</title>
  <meta name="theme-color" content="#0f172a" />

  <!--
    Force the leveling component to treat the API as same-origin (empty base) so that
    requestJson("/api/leveling/log/status") resolves to the bare path "/api/leveling/log/status".
    renderer.js shims window.fetch to intercept exactly that path and serve it locally,
    with NO backend required. This MUST run before leveling-v2.js.
  -->
  <script>window.POE2_API_BASE = "";</script>

  <!-- Applies dark/light theme from localStorage before first paint -->
  <script src="../public/components/theme-boot.js"></script>

  <!-- All checklist styling (.task-zone, .task-row, .badge, .game-overlay-*, dark mode) -->
  <link href="../public/dist/app.css" rel="stylesheet" />

  <style>
    /* Overlay-specific chrome: transparent body, single translucent rounded card. */
    html, body {
      margin: 0;
      padding: 0;
      background: transparent !important;
      /* Empty page regions stay transparent so the OS-level click-through can pass
         clicks to the game underneath; only the card itself is opaque-ish. */
      color-scheme: dark;
    }
    body {
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }

    /* The single rounded translucent card. Everything visible lives inside here. */
    #overlayCard {
      position: fixed;
      inset: 8px;
      display: flex;
      flex-direction: column;
      border-radius: 14px;
      background: rgba(15, 23, 42, 0.78);
      border: 1px solid rgba(148, 163, 184, 0.22);
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      overflow: hidden;
    }

    /* Top drag bar — the only OS-draggable region. */
    #dragBar {
      flex: 0 0 auto;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 10px;
      background: rgba(2, 6, 23, 0.55);
      border-bottom: 1px solid rgba(148, 163, 184, 0.18);
      cursor: move;
      user-select: none;
    }
    #dragBar .title {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.04em;
      color: #cbd5e1;
      text-transform: uppercase;
    }
    /* Buttons inside the drag bar must opt OUT of dragging so they're clickable. */
    #dragBar .controls {
      -webkit-app-region: no-drag;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    #dragBar .hint {
      font-size: 10px;
      color: #64748b;
    }
    #interactiveBtn {
      -webkit-app-region: no-drag;
      font-size: 10px;
      font-weight: 600;
      color: #e2e8f0;
      background: rgba(51, 65, 85, 0.7);
      border: 1px solid rgba(148, 163, 184, 0.3);
      border-radius: 6px;
      padding: 2px 8px;
      cursor: pointer;
    }
    #interactiveBtn[data-on="true"] {
      background: rgba(34, 197, 94, 0.35);
      border-color: rgba(34, 197, 94, 0.6);
    }
    .winbtn {
      -webkit-app-region: no-drag;
      width: 20px;
      height: 20px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      line-height: 1;
      color: #cbd5e1;
      background: rgba(51, 65, 85, 0.6);
      border: 1px solid rgba(148, 163, 184, 0.3);
      border-radius: 6px;
      cursor: pointer;
      padding: 0;
    }
    .winbtn:hover { background: rgba(71, 85, 105, 0.85); color: #f1f5f9; }
    #closeBtn:hover { background: rgba(239, 68, 68, 0.8); border-color: rgba(239,68,68,0.9); color: #fff; }

    /* Always-visible current-map banner (shows the live zone even when the
       checklist has no data for it). */
    #currentZone {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 5px 10px;
      font-size: 12px;
      font-weight: 600;
      color: #e2e8f0;
      background: rgba(2, 6, 23, 0.4);
      border-bottom: 1px solid rgba(148, 163, 184, 0.14);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #currentZone .pin { color: #fbbf24; }
    #currentZone .cz-name { color: #f1f5f9; overflow: hidden; text-overflow: ellipsis; }
    #currentZone .cz-nodata {
      margin-left: auto;
      font-size: 9px;
      font-weight: 600;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    /* Scrollable content holding the leveling checklist. */
    #overlayBody {
      flex: 1 1 auto;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 6px;
      /* Shrink the full web checklist down to overlay scale. */
      zoom: 0.8;
    }
    #overlayBody::-webkit-scrollbar { width: 8px; }
    #overlayBody::-webkit-scrollbar-thumb {
      background: rgba(148, 163, 184, 0.35);
      border-radius: 8px;
    }

    /* Compact price-check result panel pinned to the bottom of the card. */
    #pricePanel {
      flex: 0 0 auto;
      max-height: 220px;
      overflow-y: auto;
      border-top: 1px solid rgba(148, 163, 184, 0.18);
      background: rgba(2, 6, 23, 0.5);
      padding: 8px 10px;
      font-size: 12px;
      color: #e2e8f0;
    }
    #pricePanel .pp-empty {
      color: #64748b;
      font-size: 11px;
    }
    #pricePanel .pp-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 6px;
    }
    #pricePanel .pp-type {
      font-weight: 700;
      color: #f1f5f9;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #pricePanel .pp-count {
      font-size: 10px;
      color: #94a3b8;
      white-space: nowrap;
    }
    #pricePanel .pp-err {
      color: #f87171;
      font-size: 11px;
    }
    #pricePanel ul { list-style: none; margin: 0; padding: 0; }
    #pricePanel li {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
      padding: 2px 0;
      border-bottom: 1px dashed rgba(148, 163, 184, 0.12);
    }
    #pricePanel .pp-amount { font-weight: 700; color: #fbbf24; }
    #pricePanel .pp-cur { color: #cbd5e1; font-size: 11px; }
    #pricePanel .pp-acct {
      color: #94a3b8;
      font-size: 10px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 45%;
    }
  </style>
</head>
<body class="font-sans text-slate-100 antialiased dark">
  <div id="overlayCard">
    <div id="dragBar">
      <span class="title">POE2 Overlay</span>
      <span class="controls">
        <span class="hint">kéo để di chuyển &middot; Ctrl+Alt+L &middot; Ctrl+D giá</span>
        <button id="interactiveBtn" type="button" data-on="true">Interactive</button>
        <button id="collapseBtn" class="winbtn" type="button" title="Thu gọn / mở rộng">–</button>
        <button id="closeBtn" class="winbtn" type="button" title="Đóng overlay">✕</button>
      </span>
    </div>

    <div id="currentZone">
      <span class="pin">📍</span>
      <span class="cz-name" id="czName">Chưa vào map nào</span>
    </div>

    <div id="overlayBody">
      <!-- The leveling checklist mounts here (leveling-v2.js auto-inits). -->
      <div id="levelingV2Root"></div>
    </div>

    <!-- Compact price-check result panel. -->
    <div id="pricePanel">
      <div class="pp-empty">Hover an item in-game and press Ctrl+D to price check.</div>
    </div>
  </div>

  <!-- Checklist data: defines window.levelingRouteZones -->
  <script src="../public/data/leveling-data.js"></script>
  <!-- Interactive checklist renderer: reads levelingRouteZones, mounts to #levelingV2Root -->
  <script src="../public/components/leveling-v2.js"></script>

  <!-- Glue MUST load last so its fetch shim is installed and native hooks attach. -->
  <script src="renderer.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Boss - POE2</title>
  <meta name="description" content="Trang chi tiết uber boss Path of Exile 2 tiếng Việt: tổng quan, cơ chế, các pha, chiến thuật, phần thưởng và mẹo chiến đấu.">
  <meta name="robots" content="index,follow,max-image-preview:large">
  <link rel="canonical" href="https://poeviethoa.net/boss-detail">
  <link rel="alternate" hreflang="vi" href="https://poeviethoa.net/boss-detail">
  <meta property="og:locale" content="vi_VN">
  <meta property="og:site_name" content="POE2 Việt hóa">
  <meta property="og:type" content="article">
  <meta property="og:title" content="Uber Boss Path of Exile 2 tiếng Việt">
  <meta property="og:description" content="Trang chi tiết uber boss Path of Exile 2 tiếng Việt: tổng quan, cơ chế, các pha, chiến thuật, phần thưởng và mẹo chiến đấu.">
  <meta property="og:url" content="https://poeviethoa.net/boss-detail">
  <meta property="og:image" content="https://poeviethoa.net/assets/img/logo.jpg">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Uber Boss Path of Exile 2 tiếng Việt">
  <meta name="twitter:description" content="Trang chi tiết uber boss POE2 tiếng Việt: tổng quan, cơ chế, các pha, chiến thuật và phần thưởng.">
  <meta name="twitter:image" content="https://poeviethoa.net/assets/img/logo.jpg">
  <meta name="theme-color" content="#0f172a">
  <link rel="icon" href="/favicon.png" type="image/png" sizes="64x64">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <script src="components/theme-boot.js"></script>
  <link rel="preload" href="/assets/fonts/material-symbols-rounded.woff2" as="font" type="font/woff2" crossorigin>
  <link href="dist/app.css?v=20260529-font-ui" rel="stylesheet">
  <script defer src="app-routes.js"></script>
  <script defer src="components/app-shell.js"></script>
  <style>
    .stat-line + .stat-line { border-top: 1px solid rgb(226 232 240); }
    .dark .stat-line + .stat-line { border-top-color: rgb(30 41 59); }
  </style>
</head>

<body class="min-h-screen bg-slate-50 font-sans text-slate-900 antialiased dark:bg-slate-950 dark:text-slate-100">
  <div data-component="site-header" data-subtitle="Boss"></div>

  <main class="poe-shell-container grid gap-5 py-5" id="detailRoot"></main>

  <script src="components/poe-ui-utils.js"></script>
  <script src="data/boss-data.js"></script>
  <script>
    const data = window.POE2_BOSS_DETAILS || {};
    const params = new URLSearchParams(window.location.search);
    const slug = params.get("boss") || params.get("id") || "";
    const boss = data[slug] || null;
    const detailRoot = document.getElementById("detailRoot");

    const PAGE_TEXT = {
      notFoundTitle: { vi: "Không tìm thấy boss", en: "Boss not found" },
      notFoundDescription: { vi: "Boss này không có trong dữ liệu hiện tại.", en: "This boss is not available in the current data." },
      notFoundDocumentTitle: { vi: "Không tìm thấy boss - POE2", en: "Boss not found - POE2" },
      noData: { vi: "Không có dữ liệu.", en: "No data available." },
      back: { vi: "Boss", en: "Boss" },
      group: { vi: "Nhóm", en: "Group" },
      location: { vi: "Vị trí", en: "Location" },
      overview: { vi: "Tổng quan", en: "Overview" },
      mechanics: { vi: "Cơ chế", en: "Mechanics" },
      phases: { vi: "Các pha", en: "Phases" },
      strategy: { vi: "Chiến thuật", en: "Strategy" },
      rewards: { vi: "Phần thưởng", en: "Rewards" },
      tips: { vi: "Mẹo", en: "Tips" }
    };

    const { escapeHtml, i18nText, updateDocumentSeo, onLocaleChange } = window.PoeUi;
    const pageText = (key) => i18nText(PAGE_TEXT[key], key);

    const renderLines = (lines = []) => lines.length
      ? lines.map((line) => `<li class="stat-line px-4 py-3 text-sm font-semibold leading-6 text-slate-700 dark:text-slate-200">${escapeHtml(line)}</li>`).join("")
      : `<li class="px-4 py-3 text-sm font-semibold text-slate-500 dark:text-slate-400">${escapeHtml(pageText("noData"))}</li>`;

    const sectionList = (title, lines) => `
      <section class="overflow-hidden rounded-lg border border-slate-200 bg-white shadow-sm dark:border-slate-800 dark:bg-slate-900">
        <div class="border-b border-slate-200 px-4 py-3 dark:border-slate-800">
          <h2 class="text-sm font-black uppercase tracking-[.14em] text-slate-500 dark:text-slate-400">${escapeHtml(title)}</h2>
        </div>
        <ul>${renderLines(lines)}</ul>
      </section>
    `;

    const sectionText = (title, text) => `
      <section class="overflow-hidden rounded-lg border border-slate-200 bg-white shadow-sm dark:border-slate-800 dark:bg-slate-900">
        <div class="border-b border-slate-200 px-4 py-3 dark:border-slate-800">
          <h2 class="text-sm font-black uppercase tracking-[.14em] text-slate-500 dark:text-slate-400">${escapeHtml(title)}</h2>
        </div>
        <p class="px-4 py-4 text-base font-semibold leading-8 text-slate-700 dark:text-slate-200">${escapeHtml(text || pageText("noData"))}</p>
      </section>
    `;

    const phasesBlock = (title, phases = []) => {
      if (!phases.length) return "";
      const rows = phases.map((phase) => `
        <li class="stat-line px-4 py-4">
          <p class="text-sm font-black tracking-tight text-slate-900 dark:text-slate-100" translate="no">${escapeHtml(phase.name || "")}</p>
          <p class="mt-1.5 text-sm font-semibold leading-7 text-slate-600 dark:text-slate-300">${escapeHtml(phase.vi || phase.en || "")}</p>
        </li>
      `).join("");
      return `
        <section class="overflow-hidden rounded-lg border border-slate-200 bg-white shadow-sm dark:border-slate-800 dark:bg-slate-900">
          <div class="border-b border-slate-200 px-4 py-3 dark:border-slate-800">
            <h2 class="text-sm font-black uppercase tracking-[.14em] text-slate-500 dark:text-slate-400">${escapeHtml(title)}</h2>
          </div>
          <ul>${rows}</ul>
        </section>
      `;
    };

    const renderDetail = () => {
      if (!boss) {
        document.title = pageText("notFoundDocumentTitle");
        document.querySelector('meta[name="robots"]')?.setAttribute("content", "noindex,follow");
        detailRoot.innerHTML = `
          <section class="rounded-lg border border-slate-200 bg-white p-6 shadow-md1 dark:border-slate-800 dark:bg-slate-900">
            <a class="inline-flex items-center gap-2 text-sm font-black text-blue-700 dark:text-blue-300" href="/boss"><span class="material-symbols-rounded text-base" aria-hidden="true">arrow_back</span>${escapeHtml(pageText("back"))}</a>
            <h1 class="mt-4 text-3xl font-black text-slate-950 dark:text-white">${escapeHtml(pageText("notFoundTitle"))}</h1>
            <p class="mt-2 text-sm font-semibold leading-6 text-slate-600 dark:text-slate-300">${escapeHtml(pageText("notFoundDescription"))}</p>
          </section>
        `;
        return;
      }

      const vi = boss.vi || {};
      updateDocumentSeo({
        title: `${boss.name} - Boss POE2`,
        description: vi.overview || "",
        canonicalPath: `/boss-detail?boss=${encodeURIComponent(slug)}`,
        image: "/assets/img/logo.jpg"
      });

      const badges = [
        boss.group ? `<span class="inline-flex items-center gap-1.5 rounded-full bg-purple-50 px-3 py-1 text-xs font-black text-purple-700 ring-1 ring-purple-200 dark:bg-purple-950/40 dark:text-purple-300 dark:ring-purple-900"><span class="material-symbols-rounded text-sm" aria-hidden="true">category</span>${escapeHtml(boss.group)}</span>` : "",
        boss.location ? `<span class="inline-flex items-center gap-1.5 rounded-full bg-slate-100 px-3 py-1 text-xs font-black text-slate-700 ring-1 ring-slate-300 dark:bg-slate-800/60 dark:text-slate-200 dark:ring-slate-700"><span class="material-symbols-rounded text-sm" aria-hidden="true">location_on</span>${escapeHtml(boss.location)}</span>` : ""
      ].join("");

      detailRoot.innerHTML = `
        <section class="overflow-hidden rounded-lg border border-slate-200 bg-white shadow-md1 dark:border-slate-800 dark:bg-slate-900">
          <div class="p-5 sm:p-7">
            <a class="inline-flex items-center gap-2 text-sm font-black text-blue-700 dark:text-blue-300" href="/boss"><span class="material-symbols-rounded text-base" aria-hidden="true">arrow_back</span>${escapeHtml(pageText("back"))}</a>
            <div class="mt-5 flex items-start gap-4">
              <div class="relative grid h-16 w-16 shrink-0 place-items-center overflow-hidden rounded-lg border border-slate-200 bg-gradient-to-br from-purple-600 to-fuchsia-600 text-white dark:border-slate-700">
                <span class="material-symbols-rounded text-3xl" aria-hidden="true">skull</span>
              </div>
              <div class="min-w-0">
                <h1 class="break-words text-4xl font-black leading-tight text-slate-950 dark:text-white" translate="no">${escapeHtml(boss.name)}</h1>
                <div class="mt-3 flex flex-wrap gap-2">${badges}</div>
              </div>
            </div>
          </div>
        </section>
        ${sectionText(pageText("overview"), vi.overview)}
        <div class="grid gap-5 lg:grid-cols-2">
          ${sectionList(pageText("mechanics"), vi.mechanics || [])}
          ${phasesBlock(pageText("phases"), vi.phases || [])}
        </div>
        ${sectionText(pageText("strategy"), vi.strategy)}
        <div class="grid gap-5 lg:grid-cols-2">
          ${sectionList(pageText("rewards"), vi.rewards || [])}
          ${sectionList(pageText("tips"), vi.tips || [])}
        </div>
      `;
    };

    renderDetail();
    onLocaleChange(renderDetail);
  </script>
</body>

</html>

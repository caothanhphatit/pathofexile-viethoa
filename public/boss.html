          { name: "The Bodach", slug: "the-bodach", location: "Ritual (Caer Tarth)", type: "Pinnacle", note: { vi: "Dùng Head of the King; map Rite of the Nameless; quest Legacy of the Maji", en: "Use Head of the King; Rite of the Nameless maps; Legacy of the Maji quest" } }
        ]
      },
      {
        id: "delirium",
        label: { vi: "Delirium", en: "Delirium" },
        bosses: [
          { name: "Kosis, the Revelation", location: "Delirium/Simulacrum", type: "Delirium", note: { vi: "Spawn trong map Delirium hoặc các wave Simulacrum cao", en: "Spawns in Delirium maps or higher Simulacrum waves" } },
          { name: "Omniphobia, Fear Manifest", location: "Delirium/Simulacrum", type: "Delirium", note: { vi: "Spawn trong map Delirium hoặc các wave Simulacrum cao", en: "Spawns in Delirium maps or higher Simulacrum waves" } },
          { name: "Tangmazu, The Raven Trickster", slug: "tangmazu-the-raven-trickster", location: "Delirium (Paracosm)", type: "Pinnacle", note: { vi: "Dùng Raven's Reflection tại gương Withered Willow; quest Strange Reflections", en: "Use Raven's Reflection at Withered Willow mirror; Strange Reflections quest" } }
        ]
      },
      {
        id: "breach",
        label: { vi: "Breach", en: "Breach" },
        bosses: [
          { name: "It That Was Tul and Esh", location: "Hive Colony (Nest of the Lords)", type: "Breach", note: { vi: "Quest Keepers of the Flame", en: "Keepers of the Flame quest" } },
          { name: "Xesht, We That Are One", slug: "xesht-we-that-are-one", location: "Monastery/Twisted Domain", type: "Pinnacle", note: { vi: "Hoàn thành Hive Colony; quest Keepers of the Flame", en: "Complete Hive Colony; Keepers of the Flame quest" } }
        ]
      },
      {
        id: "abyss",
        label: { vi: "Abyss", en: "Abyss" },
        bosses: [
          { name: "Vandroth, Blackblooded Enslaver", location: "Dark Domain", type: "Abyss", note: { vi: "Phong ấn Northern Abyssal Wounds; quest Abyssal Power", en: "Seal Northern Abyssal Wounds; Abyssal Power quest" } },
          { name: "Tasgul, Swallower of Light", location: "Lightless Void", type: "Abyss", note: { vi: "Dọn Eastern Abyssal Wound; quest Abyssal Power", en: "Clear Eastern Abyssal Wound; Abyssal Power quest" } },
          { name: "Vessel of Kulemak", slug: "vessel-of-kulemak", location: "Well of Souls", type: "Pinnacle", note: { vi: "Dùng Kulemak's Invitation; quest Abyssal Power", en: "Use Kulemak's Invitation; Abyssal Power quest" } }
        ]
      },
      {
        id: "atziri-temple",
        label: { vi: "Atziri's Temple", en: "Atziri's Temple" },
        bosses: [
          { name: "Xipocado, Royal Architect", location: "Atziri's Temple", type: "Temple", note: { vi: "Cần điều khiển Temple Console; quest Fate of the Vaal", en: "Temple Console manipulation required; Fate of the Vaal quest" } },
          { name: "Atziri, the Red Queen", slug: "atziri-the-red-queen", location: "Atziri's Temple (Royal Access Chamber)", type: "Pinnacle", note: { vi: "Area Level 75+; quest Fate of the Vaal", en: "Area Level 75+; Fate of the Vaal quest" } }
        ]
      },
      {
        id: "precursor-fortress",
        label: { vi: "Precursor Fortress (Pinnacle)", en: "Precursor Fortress (Pinnacle)" },
        bosses: [
          { name: "The Arbiter of Ash", slug: "the-arbiter-of-ash", location: "Burning Monolith", type: "Pinnacle", note: { vi: "Cần Crisis Fragments; quest Legacy of the Precursors", en: "Crisis Fragments required; Legacy of the Precursors quest" } },
          { name: "The Arbiter of Divinity", slug: "the-arbiter-of-divinity", location: "Origin Tower", type: "Pinnacle", note: { vi: "Cần Origin Spark và Origin Cradle; quest Legacy of the Precursors", en: "Origin Spark and Origin Cradle required; Legacy of the Precursors quest" } }
        ]
      },
      {
        id: "expedition",
        label: { vi: "Expedition", en: "Expedition" },
        bosses: [
          { name: "Styrn, Fallen Knight of Aldur", location: "Tomb of the Fallen Knight", type: "Expedition", note: { vi: "Phá lối vào trong các encounter Expedition; quest The Grand Expedition", en: "Destroy entrance in Expedition encounters; The Grand Expedition quest" } },
          { name: "Medved, the Fallen Seer", location: "Ocean Biome", type: "Expedition", note: { vi: "Dùng Medved's Saga với Logbook; quest The Grand Expedition", en: "Use Medved's Saga with Logbook; The Grand Expedition quest" } },
          { name: "Vorana, Last to Fall", location: "Ocean Biome", type: "Expedition", note: { vi: "Dùng Vorana's Saga với Logbook; quest The Grand Expedition", en: "Use Vorana's Saga with Logbook; The Grand Expedition quest" } },
          { name: "Uhtred, the Stardrinker", location: "Ocean Biome", type: "Expedition", note: { vi: "Dùng Uhtred's Saga với Logbook; quest The Grand Expedition", en: "Use Uhtred's Saga with Logbook; The Grand Expedition quest" } },
          { name: "Olroth, Origin of the Fall", location: "Ocean Biome", type: "Expedition", note: { vi: "Dùng Olroth's Saga với Logbook; quest The Grand Expedition", en: "Use Olroth's Saga with Logbook; The Grand Expedition quest" } },
          { name: "The Aberration", location: "Verisium Crater", type: "Pinnacle", note: { vi: "Dùng Triskelion Reforged để xóa rào chắn; quest The Grand Expedition", en: "Use Triskelion Reforged to dispel barrier; The Grand Expedition quest" } }
        ]
      }
    ];

    const pageText = (key) => i18nText(PAGE_TEXT[key], key);
    const typeMeta = (type) => TYPE_META[type] || { label: { vi: type, en: type }, badge: "bg-slate-100 text-slate-700 ring-1 ring-slate-300 dark:bg-slate-800/60 dark:text-slate-200 dark:ring-slate-700" };

    const groupsContainer = document.querySelector("[data-boss-groups]");
    const navContainer = document.querySelector("[data-group-nav]");

    const renderNav = () => {
      const heading = `<span class="mr-1 inline-flex items-center gap-1.5 text-xs font-black uppercase tracking-wide text-slate-400 dark:text-slate-500"><span class="material-symbols-rounded text-sm" aria-hidden="true">bookmarks</span><span data-nav-title>${pageText("navTitle")}</span></span>`;
      const links = GROUPS.map((group) => {
        const count = group.bosses.length;
        return `<a href="#group-${group.id}" class="inline-flex items-center gap-1.5 rounded-lg border border-slate-200 bg-slate-50/80 px-3 py-1.5 text-xs font-bold text-slate-600 no-underline hover:border-purple-300 hover:bg-purple-50 hover:text-purple-700 dark:border-slate-800 dark:bg-slate-900/60 dark:text-slate-300 dark:hover:border-purple-700 dark:hover:bg-purple-950/40 dark:hover:text-purple-300"><span data-group-link="${group.id}">${i18nText(group.label, group.id)}</span><span class="rounded bg-slate-200/80 px-1.5 text-[10px] font-black text-slate-500 dark:bg-slate-800 dark:text-slate-400">${count}</span></a>`;
      }).join("");
      navContainer.innerHTML = `<div class="flex flex-wrap items-center gap-2">${heading}${links}</div>`;
    };

    const renderBossRow = (boss) => {
      const meta = typeMeta(boss.type);
      const isPinnacle = boss.type === "Pinnacle";
      const accent = isPinnacle
        ? "border-l-4 border-l-red-500 bg-red-50/40 hover:border-red-300 dark:border-l-red-500 dark:bg-red-950/20 dark:hover:border-red-700"
        : "border-l-4 border-l-transparent hover:border-l-purple-300 dark:hover:border-l-purple-800";
      const pinnacleMark = isPinnacle
        ? `<span class="material-symbols-rounded text-base text-red-500" title="Pinnacle boss" aria-hidden="true">local_fire_department</span>`
        : "";
      const nameHtml = boss.slug
        ? `<a class="font-display text-base font-black leading-tight text-slate-950 no-underline hover:text-purple-700 hover:underline dark:text-white dark:hover:text-purple-300" href="/boss-detail?boss=${encodeURIComponent(boss.slug)}" translate="no">${boss.name}</a>`
        : `<span class="font-display text-base font-black leading-tight text-slate-950 dark:text-white">${boss.name}</span>`;
      const detailLink = boss.slug
        ? `<a class="inline-flex items-center gap-1 rounded bg-purple-50 px-2.5 py-1 text-[11px] font-black uppercase tracking-wider text-purple-700 no-underline transition-colors hover:bg-purple-600 hover:text-white dark:bg-purple-950/40 dark:text-purple-300 dark:hover:bg-purple-500 dark:hover:text-white" href="/boss-detail?boss=${encodeURIComponent(boss.slug)}"><span class="material-symbols-rounded text-sm" aria-hidden="true">menu_book</span><span data-boss-detail>${pageText("detail")}</span></a>`
        : "";
      return `
        <li class="boss-row glass-panel grid gap-2 rounded-lg p-3.5 shadow-sm sm:grid-cols-[minmax(0,1.1fr)_minmax(0,1.4fr)] sm:items-start ${accent}">
          <div class="min-w-0">
            <div class="flex flex-wrap items-center gap-2">
              ${nameHtml}
              <span class="inline-flex items-center rounded-full px-2 py-0.5 text-[11px] font-black ${meta.badge}" data-boss-type>${i18nText(meta.label, boss.type)}</span>
              ${pinnacleMark}
              ${detailLink}
            </div>
            <div class="mt-1 flex items-center gap-1.5 text-sm font-semibold text-slate-500 dark:text-slate-400">
              <span class="material-symbols-rounded text-sm text-slate-400 dark:text-slate-500" aria-hidden="true">location_on</span>
              <span>${boss.location}</span>
            </div>
          </div>
          <div class="min-w-0 text-sm font-semibold leading-6 text-slate-600 dark:text-slate-300" data-boss-note>${i18nText(boss.note, "")}</div>
        </li>`;
    };

    const renderGroups = () => {
      groupsContainer.innerHTML = GROUPS.map((group) => {
        const rows = group.bosses.map(renderBossRow).join("");
        return `
          <section id="group-${group.id}" class="glass-panel rounded-lg p-5 shadow-sm dark:border-slate-800/80" aria-label="${i18nText(group.label, group.id)}">
            <div class="mb-3 flex items-center justify-between gap-3">
              <h2 class="font-display text-xl font-black leading-tight text-slate-950 dark:text-white" data-group-heading="${group.id}">${i18nText(group.label, group.id)}</h2>
              <span class="inline-flex shrink-0 items-center gap-1.5 rounded-lg border border-slate-200 bg-slate-50/80 px-2.5 py-1 text-xs font-black text-slate-600 dark:border-slate-800 dark:bg-slate-900/60 dark:text-slate-300">
                <span class="material-symbols-rounded text-sm text-purple-500" aria-hidden="true">skull</span>
                ${group.bosses.length}
              </span>
            </div>
            <ul class="grid gap-2.5">${rows}</ul>
          </section>`;
      }).join("");
    };

    const applyLocale = () => {
      document.title = pageText("documentTitle");
      document.querySelector("h1").textContent = pageText("title");
      document.querySelector("main > section:first-child")?.setAttribute("aria-label", pageText("heroLabel"));
      document.querySelector("[data-boss-count]").textContent = pageText("count");
      navContainer.setAttribute("aria-label", pageText("navLabel"));
      // Re-render localized content (group labels, type badges, notes).
      renderNav();
      renderGroups();
    };

    renderNav();
    renderGroups();
    onLocaleChange(applyLocale);
  </script>
</body>

</html>

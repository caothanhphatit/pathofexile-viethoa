          { name: "Uhtred, the Stardrinker", slug: "uhtred-the-stardrinker", location: "Ocean Biome", type: "Expedition", note: { vi: "Dùng Uhtred's Saga với Logbook; quest The Grand Expedition", en: "Use Uhtred's Saga with Logbook; The Grand Expedition quest" } },
          { name: "Olroth, Origin of the Fall", slug: "olroth-origin-of-the-fall", location: "Ocean Biome", type: "Expedition", note: { vi: "Dùng Olroth's Saga với Logbook; quest The Grand Expedition", en: "Use Olroth's Saga with Logbook; The Grand Expedition quest" } },
          { name: "The Aberration", slug: "the-aberration", location: "Verisium Crater", type: "Pinnacle", note: { vi: "Dùng Triskelion Reforged để xóa rào chắn; quest The Grand Expedition", en: "Use Triskelion Reforged to dispel barrier; The Grand Expedition quest" } }
        ]
      }
    ];

    const pageText = (key) => i18nText(PAGE_TEXT[key], key);
    const typeMeta = (type) => TYPE_META[type] || { label: { vi: type, en: type }, badge: "bg-slate-100 text-slate-700 ring-1 ring-slate-300 dark:bg-slate-800/60 dark:text-slate-200 dark:ring-slate-700" };

    const groupsContainer = document.querySelector("[data-boss-groups]");
    const navContainer = document.querySelector("[data-group-nav]");
    const toolbarContainer = document.querySelector("[data-boss-toolbar]");

    const TOTAL_COUNT = GROUPS.reduce((sum, group) => sum + group.bosses.length, 0);
    // Filter chip order — only types actually present in the data get a chip.
    const TYPE_ORDER = ["Campaign", "Optional", "Atlas", "Trial", "Ritual", "Delirium", "Breach", "Abyss", "Temple", "Expedition", "Pinnacle"];
    const presentTypes = TYPE_ORDER.filter((type) => GROUPS.some((group) => group.bosses.some((boss) => boss.type === type)));

    let searchQuery = "";
    let activeType = "all";

    const matchesFilter = (boss) => {
      if (activeType !== "all" && boss.type !== activeType) return false;
      const q = searchQuery.trim().toLowerCase();
      if (!q) return true;
      const haystack = [boss.name, boss.location, boss.note && boss.note.vi, boss.note && boss.note.en]
        .filter(Boolean).join(" ").toLowerCase();
      return haystack.includes(q);
    };

    // Groups with their bosses filtered down; empty groups are dropped entirely.
    const visibleGroups = () => GROUPS
      .map((group) => ({ ...group, bosses: group.bosses.filter(matchesFilter) }))
      .filter((group) => group.bosses.length > 0);

    const renderToolbar = () => {
      const base = "inline-flex items-center gap-1.5 rounded-lg border px-3 py-1.5 text-xs font-bold transition";
      const activeCls = "border-purple-500 bg-purple-600 text-white dark:border-purple-500 dark:bg-purple-600";
      const idleCls = "border-slate-200 bg-slate-50/80 text-slate-600 hover:border-purple-300 hover:text-purple-700 dark:border-slate-800 dark:bg-slate-900/60 dark:text-slate-300 dark:hover:border-purple-700 dark:hover:text-purple-300";
      const chip = (key, label) => `<button type="button" data-type-chip="${key}" class="${base} ${activeType === key ? activeCls : idleCls}">${label}</button>`;
      const chips = [chip("all", pageText("filterAll"))]
        .concat(presentTypes.map((type) => chip(type, i18nText(typeMeta(type).label, type))))
        .join("");
      toolbarContainer.innerHTML = `
        <div class="flex flex-col gap-3">
          <label class="relative block">
            <span class="material-symbols-rounded pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-base text-slate-400 dark:text-slate-500" aria-hidden="true">search</span>
            <input data-boss-search type="search" placeholder="${pageText("searchPlaceholder")}" class="w-full rounded-lg border border-slate-200 bg-white py-2 pl-10 pr-3 text-sm font-semibold text-slate-700 placeholder:text-slate-400 focus:border-purple-400 focus:outline-none focus:ring-2 focus:ring-purple-200 dark:border-slate-800 dark:bg-slate-900/60 dark:text-slate-200 dark:placeholder:text-slate-500 dark:focus:ring-purple-900/60" />
          </label>
          <div class="flex flex-wrap gap-2">${chips}</div>
        </div>`;
      const input = toolbarContainer.querySelector("[data-boss-search]");
      input.value = searchQuery;
      input.addEventListener("input", () => { searchQuery = input.value; applyFilters(); });
      toolbarContainer.querySelectorAll("[data-type-chip]").forEach((btn) => {
        btn.addEventListener("click", () => {
          activeType = btn.getAttribute("data-type-chip");
          renderToolbar();
          applyFilters();
        });
      });
    };

    const updateCount = () => {
      const shown = visibleGroups().reduce((sum, group) => sum + group.bosses.length, 0);
      const el = document.querySelector("[data-boss-count]");
      if (el) el.textContent = shown === TOTAL_COUNT ? pageText("count") : `${shown}/${TOTAL_COUNT}`;
    };

    const renderNav = () => {
      const heading = `<span class="mr-1 inline-flex items-center gap-1.5 text-xs font-black uppercase tracking-wide text-slate-400 dark:text-slate-500"><span class="material-symbols-rounded text-sm" aria-hidden="true">bookmarks</span><span data-nav-title>${pageText("navTitle")}</span></span>`;
      const groups = visibleGroups();
      navContainer.classList.toggle("hidden", groups.length === 0);
      const links = groups.map((group) => {
        const count = group.bosses.length;
        return `<a href="#group-${group.id}" class="inline-flex items-center gap-1.5 rounded-lg border border-slate-200 bg-slate-50/80 px-3 py-1.5 text-xs font-bold text-slate-600 no-underline hover:border-purple-300 hover:bg-purple-50 hover:text-purple-700 dark:border-slate-800 dark:bg-slate-900/60 dark:text-slate-300 dark:hover:border-purple-700 dark:hover:bg-purple-950/40 dark:hover:text-purple-300"><span data-group-link="${group.id}">${i18nText(group.label, group.id)}</span><span class="rounded bg-slate-200/80 px-1.5 text-[10px] font-black text-slate-500 dark:bg-slate-800 dark:text-slate-400">${count}</span></a>`;
      }).join("");
      navContainer.innerHTML = `<div class="flex flex-wrap items-center gap-2">${heading}${links}</div>`;
    };

    const renderBossRow = (boss) => {
      const meta = typeMeta(boss.type);
      const isPinnacle = boss.type === "Pinnacle";
      const accent = isPinnacle
        ? "border-l-4 border-l-red-500 bg-red-50/40 hover:border-red-300 dark:border-l-red-500 dark:bg-red-950/20 dark:hover:border-red-700"
        : "border-l-4 border-l-transparent hover:border-l-purple-300 dark:hover:border-l-purple-800";
      const pinnacleMark = isPinnacle
        ? `<span class="material-symbols-rounded text-base text-red-500" title="Pinnacle boss" aria-hidden="true">local_fire_department</span>`
        : "";
      const nameHtml = boss.slug
        ? `<a class="font-display text-base font-black leading-tight text-slate-950 no-underline hover:text-purple-700 hover:underline dark:text-white dark:hover:text-purple-300" href="/boss-detail?boss=${encodeURIComponent(boss.slug)}" translate="no">${boss.name}</a>`
        : `<span class="font-display text-base font-black leading-tight text-slate-950 dark:text-white">${boss.name}</span>`;
      const detailLink = boss.slug
        ? `<a class="inline-flex items-center gap-1 rounded bg-purple-50 px-2.5 py-1 text-[11px] font-black uppercase tracking-wider text-purple-700 no-underline transition-colors hover:bg-purple-600 hover:text-white dark:bg-purple-950/40 dark:text-purple-300 dark:hover:bg-purple-500 dark:hover:text-white" href="/boss-detail?boss=${encodeURIComponent(boss.slug)}"><span class="material-symbols-rounded text-sm" aria-hidden="true">menu_book</span><span data-boss-detail>${pageText("detail")}</span></a>`
        : "";
      const thumbUrl = boss.slug ? (window.POE2_BOSS_IMAGES || {})[boss.slug]?.hero : null;
      const thumb = thumbUrl
        ? `<a href="/boss-detail?boss=${encodeURIComponent(boss.slug)}" class="shrink-0"><img src="${thumbUrl}" alt="" class="h-16 w-16 rounded-lg border border-slate-200 object-cover transition hover:opacity-90 dark:border-slate-700" loading="lazy"></a>`
        : `<span class="grid h-16 w-16 shrink-0 place-items-center rounded-lg border border-slate-200 bg-gradient-to-br from-purple-500/15 to-fuchsia-500/15 text-purple-400 dark:border-slate-700"><span class="material-symbols-rounded text-2xl" aria-hidden="true">skull</span></span>`;
      return `
        <li class="boss-row glass-panel flex gap-3 rounded-lg p-3.5 shadow-sm ${accent}">
          ${thumb}
          <div class="grid min-w-0 flex-1 gap-2 sm:grid-cols-[minmax(0,1.1fr)_minmax(0,1.4fr)] sm:items-start">
            <div class="min-w-0">
              <div class="flex flex-wrap items-center gap-2">
                ${nameHtml}
                <span class="inline-flex items-center rounded-full px-2 py-0.5 text-[11px] font-black ${meta.badge}" data-boss-type>${i18nText(meta.label, boss.type)}</span>
                ${pinnacleMark}
                ${detailLink}
              </div>
              <div class="mt-1 flex items-center gap-1.5 text-sm font-semibold text-slate-500 dark:text-slate-400">
                <span class="material-symbols-rounded text-sm text-slate-400 dark:text-slate-500" aria-hidden="true">location_on</span>
                <span>${boss.location}</span>
              </div>
            </div>
            <div class="min-w-0 text-sm font-semibold leading-6 text-slate-600 dark:text-slate-300" data-boss-note>${i18nText(boss.note, "")}</div>
          </div>
        </li>`;
    };

    const renderGroups = () => {
      const groups = visibleGroups();
      if (groups.length === 0) {
        groupsContainer.innerHTML = `<div class="glass-panel rounded-lg p-8 text-center text-sm font-semibold text-slate-500 shadow-sm dark:border-slate-800/80 dark:text-slate-400">${pageText("noResults")}</div>`;
        return;
      }
      groupsContainer.innerHTML = groups.map((group) => {
        const rows = group.bosses.map(renderBossRow).join("");
        return `
          <section id="group-${group.id}" class="glass-panel rounded-lg p-5 shadow-sm dark:border-slate-800/80" aria-label="${i18nText(group.label, group.id)}">
            <div class="mb-3 flex items-center justify-between gap-3">
              <h2 class="font-display text-xl font-black leading-tight text-slate-950 dark:text-white" data-group-heading="${group.id}">${i18nText(group.label, group.id)}</h2>
              <span class="inline-flex shrink-0 items-center gap-1.5 rounded-lg border border-slate-200 bg-slate-50/80 px-2.5 py-1 text-xs font-black text-slate-600 dark:border-slate-800 dark:bg-slate-900/60 dark:text-slate-300">
                <span class="material-symbols-rounded text-sm text-purple-500" aria-hidden="true">skull</span>
                ${group.bosses.length}
              </span>
            </div>
            <ul class="grid gap-2.5">${rows}</ul>
          </section>`;
      }).join("");
    };

    const applyFilters = () => {
      renderNav();
      renderGroups();
      updateCount();
    };

    const applyLocale = () => {
      document.title = pageText("documentTitle");
      document.querySelector("h1").textContent = pageText("title");
      document.querySelector("main > section:first-child")?.setAttribute("aria-label", pageText("heroLabel"));
      navContainer.setAttribute("aria-label", pageText("navLabel"));
      // Re-render localized content (toolbar, group labels, type badges, notes).
      renderToolbar();
      applyFilters();
    };

    renderToolbar();
    applyFilters();
    onLocaleChange(applyLocale);
  </script>
</body>

</html>

# POEVH builds published by `npm run poevh:publish`. The manifest changes on every
# release; the versioned exe never does.
location = /downloads/poevh/latest.json {
  add_header Cache-Control "no-cache";
  try_files $uri =404;
}

location ~ ^/downloads/poevh/[^/]+\.(exe|zip)$ {
  add_header Cache-Control "public, max-age=31536000, immutable";
  add_header Content-Disposition "attachment";
  try_files $uri =404;
}

location / {
  try_files $uri $uri/ /index.html;
}
